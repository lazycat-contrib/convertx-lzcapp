version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/convertx.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: convertx
build:
  toolchains: []
  run_buildscript: false
images:
  - id: convertx
    target: service
    service: convertx
    source: ghcr.io/c4illin/convertx
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: ConvertX
    summary: 自托管在线文件转换工具，支持超过 1000 种格式。
